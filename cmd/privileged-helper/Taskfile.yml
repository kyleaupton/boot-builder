version: "3"

vars:
  HELPER_NAME: "dev.kyleupton.boot-builder.helper"
  BUILD_DIR: "../../build/helpers"
  BUNDLE_DIR: "{{.BUILD_DIR}}/{{.HELPER_NAME}}"

tasks:
  build:
    summary: Build the privileged helper as a single binary with embedded plists
    cmds:
      - task: clean
      - task: compile
      - task: sign

  clean:
    summary: Remove old build artifacts
    cmds:
      - rm -rf {{.BUNDLE_DIR}}
      - rm -f {{.BUILD_DIR}}/{{.HELPER_NAME}}.bin

  compile:
    summary: Compile the helper binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - |
        clang -framework Foundation -framework Cocoa -framework DiskArbitration \
          -fobjc-arc \
          -mmacosx-version-min=10.15 \
          -sectcreate __TEXT __info_plist Info.plist \
          -sectcreate __TEXT __launchd_plist launchd.plist \
          -o {{.BUILD_DIR}}/{{.HELPER_NAME}} \
          main.m BBPrivilegedHelper.m

  # create:bundle:
  #   summary: Create helper bundle structure
  #   deps: [compile]
  #   cmds:
  #     - mkdir -p {{.BUNDLE_DIR}}/Contents/MacOS
  #     - mkdir -p {{.BUNDLE_DIR}}/Contents/Resources
  #     - mv {{.BUILD_DIR}}/{{.HELPER_NAME}}.bin {{.BUNDLE_DIR}}/Contents/MacOS/{{.HELPER_NAME}}
  #     - cp Info.plist {{.BUNDLE_DIR}}/Contents/
  #     - cp launchd.plist {{.BUNDLE_DIR}}/Contents/Resources/

  sign:
    summary: Code sign the helper binary
    cmds:
      - codesign --force --sign - --options runtime {{.BUILD_DIR}}/{{.HELPER_NAME}}

  verify:
    summary: Verify code signature
    cmds:
      - codesign -vvv --strict {{.BUILD_DIR}}/{{.HELPER_NAME}}
