version: "3"

includes:
  common: ../Taskfile.yml
  helper:
    taskfile: ../../cmd/privileged-helper/Taskfile.yml
    dir: ../../cmd/privileged-helper

tasks:
  build:
    summary: Creates a production build of the application
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -tags flashitxpc -o {{.OUTPUT}}
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.Version={{.VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}"
      OUTPUT: "{{ .OUTPUT | default .DEFAULT_OUTPUT }}"
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: "{{.ARCH | default ARCH}}"
      CGO_CFLAGS: "-mmacosx-version-min=10.15"
      CGO_LDFLAGS: "-mmacosx-version-min=10.15"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:helper:
    summary: Build the privileged helper
    cmds:
      - task: helper:build

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: build:helper
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  generate:info:plist:
    summary: Generates Info.plist from template with Team ID and version substitution
    preconditions:
      - sh: '[ -n "$APPLE_TEAM_ID" ]'
        msg: "APPLE_TEAM_ID environment variable must be set"
    cmds:
      - |
        sed -e 's/${APPLE_TEAM_ID}/'"$APPLE_TEAM_ID"'/g' \
            -e 's/${VERSION}/{{.VERSION | default "0.1.0"}}/g' \
            build/darwin/Info.plist.template > build/darwin/Info.plist

  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      - task: generate:info:plist
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources,Library/LaunchServices}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents
      # Copy privileged helper into app bundle (required for SMJobBless)
      - cp -r build/helpers/dev.kyleupton.flashit.helper {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Library/LaunchServices/
      # Sign in correct order: helper first, then app bundle
      # Uses APPLE_SIGNING_IDENTITY env var, or falls back to ad-hoc signing
      # Entitlements required for hardened runtime + notarization
      - codesign --force --options runtime --entitlements build/darwin/entitlements.plist --sign "{{.SIGNING_IDENTITY}}" {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Library/LaunchServices/dev.kyleupton.flashit.helper
      - codesign --force --options runtime --entitlements build/darwin/entitlements.plist --sign "{{.SIGNING_IDENTITY}}" {{.BIN_DIR}}/{{.APP_NAME}}.app
    vars:
      SIGNING_IDENTITY: '{{.APPLE_SIGNING_IDENTITY | default "-"}}'

  run:
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS
      - cp build/darwin/Info.dev.plist {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.dev.app
      - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"
