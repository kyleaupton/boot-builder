version: "3"

vars:
  HELPER_NAME: "flashit-helper"
  BUILD_DIR: "../../bin/helpers"

tasks:
  build:
    summary: Build the Windows privileged helper
    cmds:
      - task: clean
      - task: compile

  clean:
    summary: Remove old build artifacts
    cmds:
      - cmd: powershell -Command "Stop-Process -Name '{{.HELPER_NAME}}' -Force -ErrorAction SilentlyContinue; exit 0"
        platforms: [windows]
      - cmd: powershell -Command "Remove-Item -Force -ErrorAction SilentlyContinue '{{.BUILD_DIR}}/{{.HELPER_NAME}}.exe'; exit 0"
        platforms: [windows]
      - cmd: rm -f {{.BUILD_DIR}}/{{.HELPER_NAME}}.exe
        platforms: [linux, darwin]

  compile:
    summary: Compile the helper binary with gcc (MinGW)
    cmds:
      - cmd: powershell -Command "New-Item -ItemType Directory -Force -Path '{{.BUILD_DIR}}' | Out-Null; exit 0"
        platforms: [windows]
      - cmd: mkdir -p {{.BUILD_DIR}}
        platforms: [linux, darwin]
      - gcc -O2 -Wall -o {{.BUILD_DIR}}/{{.HELPER_NAME}}.exe main.c protocol.c diskops.c pipe.c cJSON.c -lkernel32

  compile:cross:
    summary: Cross-compile from Linux/macOS using MinGW
    platforms: [linux, darwin]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - x86_64-w64-mingw32-gcc -O2 -Wall -o {{.BUILD_DIR}}/{{.HELPER_NAME}}.exe main.c protocol.c diskops.c pipe.c cJSON.c -lkernel32

  test:
    summary: Run basic compilation test
    platforms: [windows]
    cmds:
      - task: build
      - "{{.BUILD_DIR}}/{{.HELPER_NAME}}.exe || echo Helper exited (expected - no pipe name provided)"
