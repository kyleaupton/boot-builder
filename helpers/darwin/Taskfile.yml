version: "3"

vars:
  HELPER_NAME: "dev.kyleupton.flashit.helper"
  BUILD_DIR: "../../bin/helpers"
  BUNDLE_DIR: "{{.BUILD_DIR}}/{{.HELPER_NAME}}"

tasks:
  build:
    summary: Build the privileged helper as a single binary with embedded plists
    cmds:
      - task: clean
      - task: generate:info:plist
      - task: compile
      - task: sign

  clean:
    summary: Remove old build artifacts
    cmds:
      - rm -rf {{.BUNDLE_DIR}}
      - rm -f {{.BUILD_DIR}}/{{.HELPER_NAME}}.bin
      - rm -f Info.plist

  generate:info:plist:
    summary: Generates Info.plist from template with Team ID and version substitution
    preconditions:
      - sh: '[ -n "$APPLE_TEAM_ID" ]'
        msg: "APPLE_TEAM_ID environment variable must be set"
    vars:
      # Build version as timestamp (YYYYMMDD.HHMMSS) - ensures updates always install
      BUILD_VERSION:
        sh: date +%Y%m%d.%H%M%S
    cmds:
      - |
        sed -e 's/${APPLE_TEAM_ID}/'"$APPLE_TEAM_ID"'/g' \
            -e 's/${HELPER_BUILD_VERSION}/{{.BUILD_VERSION}}/g' \
            Info.plist.template > Info.plist

  compile:
    summary: Compile the helper binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - |
        clang -framework Foundation -framework Cocoa -framework DiskArbitration \
          -fobjc-arc \
          -mmacosx-version-min=10.15 \
          -sectcreate __TEXT __info_plist Info.plist \
          -sectcreate __TEXT __launchd_plist launchd.plist \
          -o {{.BUILD_DIR}}/{{.HELPER_NAME}} \
          main.m BBPrivilegedHelper.m

  # create:bundle:
  #   summary: Create helper bundle structure
  #   deps: [compile]
  #   cmds:
  #     - mkdir -p {{.BUNDLE_DIR}}/Contents/MacOS
  #     - mkdir -p {{.BUNDLE_DIR}}/Contents/Resources
  #     - mv {{.BUILD_DIR}}/{{.HELPER_NAME}}.bin {{.BUNDLE_DIR}}/Contents/MacOS/{{.HELPER_NAME}}
  #     - cp Info.plist {{.BUNDLE_DIR}}/Contents/
  #     - cp launchd.plist {{.BUNDLE_DIR}}/Contents/Resources/

  sign:
    summary: Code sign the helper binary
    cmds:
      # Uses APPLE_SIGNING_IDENTITY env var, or falls back to ad-hoc signing
      - codesign --force --sign "{{.SIGNING_IDENTITY}}" --options runtime {{.BUILD_DIR}}/{{.HELPER_NAME}}
    vars:
      SIGNING_IDENTITY: '{{.APPLE_SIGNING_IDENTITY | default "-"}}'

  verify:
    summary: Verify code signature
    cmds:
      - codesign -vvv --strict {{.BUILD_DIR}}/{{.HELPER_NAME}}
